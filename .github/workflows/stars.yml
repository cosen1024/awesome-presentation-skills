name: Update repository stars

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repository-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Refresh Stars cache
        run: python scripts/update_stars.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Render and validate
        run: |
          python scripts/render_readmes.py --write
          python scripts/validate_data.py
          python scripts/render_readmes.py --check
          python -m unittest discover -s tests
          git diff --check
      - name: Commit changed Stars
        run: |
          git add data/stars.json README.md README_EN.md
          if git diff --cached --quiet; then
            echo "No Stars changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update repository stars"
          git push
