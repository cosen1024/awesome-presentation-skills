name: Catalog health

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check pinned evidence links
        continue-on-error: true
        run: python scripts/check_links.py --scope all --workers 6 > link-report.txt 2>&1
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-link-report
          path: link-report.txt
          if-no-files-found: error
          retention-days: 30
