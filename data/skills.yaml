categories:
  - id: editable-pptx
    name_zh: 可编辑 PPTX
    name_en: Editable PPTX
    description_zh: 主要工作流直接创建或编辑 PowerPoint 原生文本、形状、图表和其他对象。
    description_en: Workflows that directly create or edit native PowerPoint text, shapes, charts, and other objects.
  - id: html-slides
    name_zh: HTML 演示
    name_en: HTML Slides
    description_zh: 以 HTML、CSS、JavaScript、Markdown 或前端组件作为权威演示源。
    description_en: Workflows whose authoritative presentation source is HTML, CSS, JavaScript, Markdown, or frontend components.
  - id: image-first
    name_zh: 图片式 PPT
    name_en: Image-first Presentations
    description_zh: 先生成整页幻灯片图片，再封装为 PPTX、PDF、网页或视频。
    description_en: Workflows that generate whole-slide images before packaging them as PPTX, PDF, web, or video outputs.

